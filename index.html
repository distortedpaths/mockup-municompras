<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prototipo de gestión de compras y presupuesto de la Municipalidad de Santiago." />
    <title>Municipalidad de Santiago | Gestión de compras</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login-root" class="login-root" hidden></div>
    <div id="app" class="app-shell" hidden>
      <aside id="sidebar" class="sidebar" aria-label="Navegación principal"></aside>
      <div class="app-column">
        <header id="topbar" class="topbar"></header>
        <main id="main-content" class="main-content">
          <div id="breadcrumb" class="breadcrumb" aria-label="Ruta de navegación"></div>
          <section id="view-root" class="view-root" aria-live="polite"></section>
        </main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js" defer></script>
  </body>
</html>
